apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: ai-trust-app }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: clickhouse-data, namespace: ai-trust-app }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: ai-trust-app }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
# ---------------- POSTGRES ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, value: ai_trust }
            # PGDATA in a SUBDIR of the mount — OpenStack/Cinder PVCs contain a lost+found,
            # and Postgres refuses to initdb directly on a non-empty mount point.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/init.sh, subPath: init.sh, readOnly: true }
          readinessProbe:
            exec: { command: ["sh","-c","pg_isready -U $POSTGRES_USER"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
        - { name: init, configMap: { name: pg-init, defaultMode: 0755 } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ai-trust-app }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
# ---------------- RABBITMQ ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_USER } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD } } }
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics","ping"] }
            timeoutSeconds: 5
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: ai-trust-app }
spec: { selector: { app: rabbitmq }, ports: [{ name: amqp, port: 5672, targetPort: 5672 }, { name: mgmt, port: 15672, targetPort: 15672 }] }
---
# ---------------- MINIO ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server","/data","--console-address",":9001"]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_PASSWORD } } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: minio-data } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: ai-trust-app }
spec: { selector: { app: minio }, ports: [{ name: api, port: 9000, targetPort: 9000 }, { name: console, port: 9001, targetPort: 9001 }] }
---
# ---------------- CLICKHOUSE ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: clickhouse, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      securityContext:
        fsGroup: 101
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh","-c","chown -R 101:101 /var/lib/clickhouse"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.5-alpine
          securityContext:
            runAsUser: 101
            runAsGroup: 101
          env:
            - { name: CLICKHOUSE_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: CLICKHOUSE_USER } } }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: CLICKHOUSE_PASSWORD } } }
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: MINIO_ROOT_PASSWORD } } }
          ports: [{ containerPort: 8123 }, { containerPort: 9440 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d, readOnly: true }
          readinessProbe:
            exec: { command: ["sh","-c","clickhouse-client --user $CLICKHOUSE_USER --password $CLICKHOUSE_PASSWORD --query 'SELECT 1'"] }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: clickhouse-data } }
        - { name: config, configMap: { name: ch-config } }
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: ai-trust-app }
spec: { selector: { app: clickhouse }, ports: [{ name: http, port: 8123, targetPort: 8123 }] }
---
# ---------------- KEYCLOAK ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: ai-trust-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev"]
          env:
            - { name: KEYCLOAK_ADMIN, valueFrom: { secretKeyRef: { name: app-secrets, key: KEYCLOAK_ADMIN } } }
            - { name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: KEYCLOAK_ADMIN_PASSWORD } } }
            # Keycloak 25+ bootstraps the initial admin from KC_BOOTSTRAP_ADMIN_* (the legacy KEYCLOAK_ADMIN_*
            # are deprecated and were NOT reliably creating the admin here → 403 at the master token endpoint).
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: app-secrets, key: KEYCLOAK_ADMIN } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: KEYCLOAK_ADMIN_PASSWORD } } }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } } }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
            - { name: KC_HTTP_RELATIVE_PATH, value: "/keycloak" }
          # Pod IPs (100.64.0.0/10 CGNAT on this shoot) are NOT RFC1918, so Keycloak's default
          # master sslRequired=external treats in-cluster HTTP token requests as "external" → 403
          # "HTTPS required", which blocks keycloak-provision. Relax master to sslRequired=NONE once
          # Keycloak is up, over localhost (where the ssl gate passes). Idempotent; retries until ready.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      /opt/keycloak/bin/kcadm.sh config credentials \
                        --server http://localhost:8080/keycloak --realm master \
                        --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null 2>&1 \
                      && /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE >/dev/null 2>&1 \
                      && echo "master sslRequired=NONE set" && exit 0
                      sleep 5
                    done
                    echo "warning: could not relax master sslRequired (keycloak may not be ready)"; exit 0
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /keycloak/realms/master, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: ai-trust-app }
spec: { selector: { app: keycloak }, ports: [{ port: 8080, targetPort: 8080 }] }
---
# ---------------- MARKETPLACE: in-cluster image registry (registry:2, plain HTTP) ----------------
# Built kind="dockerfile"/OCM-built apps are pushed here and run from here. marketplace-backend
# reaches it as MARKETPLACE_REGISTRY=registry:5000. NOTE: the node containerd must trust registry:5000
# as an insecure registry for the kubelet to PULL built images — see operator-gaps.md (not configured
# on the Gardener shoot; the shared app + prebuilt-GHCR-image deploys are unaffected).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: registry-data, namespace: ai-trust-app }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: "10Gi" } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: ai-trust-app }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: registry:2
          env:
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
          readinessProbe: { httpGet: { path: /v2/, port: 5000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /v2/, port: 5000 }, initialDelaySeconds: 15, periodSeconds: 15 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: ai-trust-app }
spec: { selector: { app: registry }, ports: [{ port: 5000, targetPort: 5000 }] }
---
# ---------------- MARKETPLACE: SA + namespaced RBAC for the in-cluster controller ----------------
# marketplace-backend runs as this SA; it creates/manages Deployments/Services/Jobs/Secrets/Pods for
# the apps a user deploys — only in THIS namespace.
apiVersion: v1
kind: ServiceAccount
metadata: { name: marketplace, namespace: ai-trust-app }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: marketplace-deployer, namespace: ai-trust-app }
rules:
  - { apiGroups: ["apps"], resources: ["deployments"], verbs: ["create","get","list","watch","update","patch","delete"] }
  - { apiGroups: [""], resources: ["services"], verbs: ["create","get","list","watch","delete"] }
  - { apiGroups: [""], resources: ["pods","pods/log"], verbs: ["get","list","watch"] }
  - { apiGroups: ["batch"], resources: ["jobs"], verbs: ["create","get","list","watch","delete"] }
  - { apiGroups: [""], resources: ["secrets"], verbs: ["create","get","update","patch","delete"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: marketplace-deployer, namespace: ai-trust-app }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: marketplace-deployer }
subjects:
  - { kind: ServiceAccount, name: marketplace, namespace: ai-trust-app }
