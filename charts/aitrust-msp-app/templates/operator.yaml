apiVersion: v1
kind: ServiceAccount
metadata:
  name: aitrust-msp-operator
  namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: the operator creates per-instance Namespaces, applies the full app stack (~40 objects)
# into arbitrary namespaces, and patches the shared Gateway + creates HTTPRoutes/ReferenceGrants in the
# gateway namespace. This broad grant is the main deviation from a normal namespaced operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aitrust-msp-operator
rules:
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["batch"]
  resources: [jobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: [httproutes, referencegrants]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: [gateways]
  verbs: [get, list, watch, update, patch]
- apiGroups: ["trust.aitrust.msp"]
  resources: [aitrustplatforminstances, aitrustplatforminstances/status]
  verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aitrust-msp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aitrust-msp-operator
subjects:
- kind: ServiceAccount
  name: aitrust-msp-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-msp-operator
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: aitrust-msp-operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aitrust-msp-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aitrust-msp-operator }
    spec:
      serviceAccountName: aitrust-msp-operator
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: operator
        image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
        imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
        env:
        - { name: INSTANCE_DOMAIN_SUFFIX, value: "{{ .Values.operator.instanceDomainSuffix }}" }
        - { name: REGISTRY, value: "{{ .Values.operator.registry }}" }
        - { name: TAG, value: "{{ .Values.operator.tag }}" }
        - { name: GATEWAY_NS, value: "{{ .Values.operator.gatewayNamespace }}" }
        - { name: GATEWAY_NAME, value: "{{ .Values.operator.gatewayName }}" }
        - { name: MSP_WORKER_LABEL, value: "{{ .Values.operator.mspWorkerLabel }}" }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
