apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aitrustplatforminstances.trust.aitrust.msp
spec:
  group: trust.aitrust.msp
  names:
    kind: AITrustPlatformInstance
    listKind: AITrustPlatformInstanceList
    plural: aitrustplatforminstances
    singular: aitrustplatforminstance
    shortNames: [aitp]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: URL
      type: string
      jsonPath: .status.url
    - name: Ready
      type: boolean
      jsonPath: .status.ready
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: { type: string }
          kind: { type: string }
          metadata: { type: object }
          spec:
            type: object
            properties:
              displayName: { type: string, default: "AI Trust Platform" }
              # optional desired subdomain label; if empty the operator derives <ns>-<name>.<suffix>
              hostname: { type: string, default: "" }
              sizeClass: { type: string, enum: [small, standard, large], default: standard }
              adminEmail: { type: string, default: "" }
              registryOverride: { type: string, default: "" }
              tagOverride: { type: string, default: "" }
              # forward-compat passthrough (no behaviour today; single-tenant app has no model switch)
              model: { type: string, default: "" }
          status:
            type: object
            properties:
              ready: { type: boolean }
              url: { type: string }
              phase: { type: string }
              namespace: { type: string }
              observedGeneration: { type: integer }
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    status: { type: string }
                    reason: { type: string }
                    message: { type: string }
                    lastTransitionTime: { type: string, format: date-time }
    subresources:
      status: {}
