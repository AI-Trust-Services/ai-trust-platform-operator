# aitrust-msp-app — workload chart values
nameOverride: aitrust
exportName: trust.aitrust.msp     # APIExport/EndpointSlice the syncagent binds to (must match the pm chart)

# The MSP operator that renders + applies the full app stack per AITrustPlatformInstance.
operator:
  image:
    repository: mirceacraciun795/aitrust-msp-operator
    tag: v1
    pullPolicy: IfNotPresent
  # env driving per-instance rendering
  instanceDomainSuffix: aitrust-1.ai-trust.shoot.gardener.cc-one.showroom.apeirora.eu
  registry: mirceacraciun795      # app images live here (built by Standard_Ai_Platform)
  tag: aitrust-1                  # app image tag
  gatewayNamespace: platform-mesh-system
  gatewayName: k8sapi-gateway
  mspWorkerLabel: msp-aitrust     # node pool label the per-instance pods are pinned to

# api-syncagent: mirrors the AITrustPlatformInstance CR spec-down / status-up between the kcp
# provider workspace and this shoot.
syncagent:
  image:
    repository: ghcr.io/kcp-dev/api-syncagent
    tag: v0.5.1
    pullPolicy: IfNotPresent
kcpKubeconfig:
  # MUST be :8443 on this mesh (chart-default :6443 is wrong here — the #1 syncagent-timeout gotcha).
  inClusterServerUrl: https://frontproxy-front-proxy.platform-mesh-system.svc.cluster.local:8443
  # the mesh kcp-admin kubeconfig content is injected at install via --set-file kcpKubeconfig.adminContent
  adminContent: ""

# Portal content nginx serving /pm-content.json (the marketplace tile). MUST be enabled — off is the
# #1 "tile never renders" cause (see Standard_MSP_Demo/PORTAL_TILES_FINDING.md).
portalIntegration:
  enabled: true
  image:
    repository: nginx
    tag: "1.27"
    pullPolicy: IfNotPresent

# Where the operator + syncagent themselves run (the MSP control plane, not the per-instance copies).
nodeSelector: {}
