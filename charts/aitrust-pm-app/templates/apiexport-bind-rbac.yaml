# Let consumers bind (Enable) this APIExport. The stock pattern binds only system:anonymous; a real
# logged-in portal user is system:authenticated, so we bind BOTH (else Enable -> cannot create apibindings).
# (Step 3 also calls bind_authenticated as a belt-and-suspenders retrofit.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apiexport-bind
rules:
- apiGroups: ["apis.kcp.io"]
  resources: ["apiexports"]
  resourceNames: ["{{ .Values.exportName }}"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apiexport-bind-anonymous
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apiexport-bind
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:anonymous
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apiexport-bind-authenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apiexport-bind
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:authenticated
