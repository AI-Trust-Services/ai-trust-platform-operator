# aitrust-mt-pm-app — kcp-side values
exportName: sub.aitrustmt.msp

# ContentConfiguration source. Point at the workload chart's IN-CLUSTER nginx over HTTP:
# the mesh is self-signed and the extension-manager reconciler does strict TLS verification, so an
# external HTTPS host fails with x509 unknown-authority (proven in Standard_MSP_Demo/PORTAL_TILES_FINDING.md).
content:
  publicScheme: http
  publicHost: aitrust-mt-portal.aitrust-mt-msp.svc.cluster.local
  path: /pm-content.json

provider:
  displayName: AI Trust Platform MT
  description: >-
    EU AI Act compliance platform (multi-tenant) — register AI systems, get automatic risk-tier
    classification (Annex III), monitoring, alerting, decision-trace analysis and
    compliance tracking. Each subscription provisions an isolated tenant inside the
    shared platform (per-tenant Keycloak realm + tenant_id data isolation).
