{{- if .Values.portalIntegration.enabled }}
# nginx serving /pm-content.json — the portal micro-frontend descriptor that renders the marketplace
# tile + nav for Subscription. The pm chart's ContentConfiguration points at this Service
# over IN-CLUSTER HTTP (self-signed mesh breaks external-HTTPS CC TLS verify).
apiVersion: v1
kind: ConfigMap
metadata:
  name: aitrust-portal-config
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/component: portal-integration }
data:
  pm-content.json: |-
    {
      "name": "aitrust",
      "luigiConfigFragment": {
        "data": {
          "nodes": [
            {
              "pathSegment": "subscriptions",
              "navigationContext": "subscriptions",
              "label": "Subscriptions",
              "icon": "shield",
              "entityType": "main.core_platform-mesh_io_account.namespace",
              "category": { "label": "AI Trust Platform", "icon": "shield", "collapsible": true, "order": 810 },
              "url": "/assets/platform-mesh-portal-ui-wc.js#generic-list-view",
              "webcomponent": { "selfRegistered": true },
              "keepSelectedForChildren": true,
              "context": {
                "resourceDefinition": {
                  "apiGroup": "sub_aitrust_msp",
                  "version": "v1alpha1",
                  "entity": "Subscription",
                  "entityCollection": "Subscriptions",
                  "group": "sub.aitrust.msp",
                  "plural": "subscriptions",
                  "singular": "subscription",
                  "kind": "Subscription",
                  "scope": "Namespaced",
                  "namespace": null,
                  "ui": {
                    "logoUrl": "https://ai-trust-services.github.io/logo.svg",
                    "createView": {
                      "fields": [
                        { "label": "Name", "property": "metadata.name", "required": true },
                        { "label": "Display Name", "property": "spec.displayName", "required": true },
                        { "label": "Organization (mesh realm — auth realm; one subscription per org)", "property": "spec.org", "required": true },
                        { "label": "Admin Email", "property": "spec.adminEmail" }
                      ]
                    },
                    "listView": {
                      "fields": [
                        { "label": "Name", "property": "metadata.name" },
                        { "label": "Display Name", "property": "spec.displayName" },
                        { "label": "Org", "property": "spec.org" },
                        { "label": "URL", "property": "status.url" },
                        { "label": "Phase", "labelDisplay": true, "property": "status.phase" },
                        { "label": "Ready", "labelDisplay": true, "property": "status.ready" }
                      ]
                    }
                  }
                }
              },
              "children": [
                {
                  "pathSegment": ":subscriptionId",
                  "hideFromNav": true,
                  "context": { "subscriptionId": ":subscriptionId" },
                  "defineEntity": {
                    "id": "subscription",
                    "contextKey": "subscriptionId",
                    "graphqlEntity": {
                      "group": "sub.aitrust.msp",
                      "kind": "Subscription",
                      "query": "{ metadata { name } }",
                      "version": "v1alpha1"
                    }
                  },
                  "keepSelectedForChildren": false
                }
              ]
            }
          ]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-portal-integration
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/component: portal-integration }
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: portal-integration
      app.kubernetes.io/instance: aitrust-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/component: portal-integration
        app.kubernetes.io/instance: aitrust-portal
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: nginx
        image: "{{ .Values.portalIntegration.image.repository }}:{{ .Values.portalIntegration.image.tag }}"
        imagePullPolicy: {{ .Values.portalIntegration.image.pullPolicy }}
        ports:
        - { containerPort: 80, name: http }
        volumeMounts:
        - name: portal-config
          mountPath: /usr/share/nginx/html/pm-content.json
          subPath: pm-content.json
      volumes:
      - name: portal-config
        configMap:
          name: aitrust-portal-config
---
apiVersion: v1
kind: Service
metadata:
  name: aitrust-portal
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/component: portal-integration }
spec:
  selector:
    app.kubernetes.io/component: portal-integration
    app.kubernetes.io/instance: aitrust-portal
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
