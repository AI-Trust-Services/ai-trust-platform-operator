apiVersion: v1
kind: ServiceAccount
metadata:
  name: aitrust-mt-operator
  namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: the MT operator provisions per-tenant realms + tenant_id isolation inside the ONE
# shared app, and may patch shared Gateway/HTTPRoutes/ReferenceGrants in the gateway namespace. This
# broad grant is retained from the MSP operator (the MT operator still needs cluster access).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aitrust-mt-operator
rules:
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["batch"]
  resources: [jobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: [httproutes, referencegrants]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: [gateways]
  verbs: [get, list, watch, update, patch]
- apiGroups: ["sub.aitrustmt.msp"]
  resources: [subscriptions, subscriptions/status]
  verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aitrust-mt-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aitrust-mt-operator
subjects:
- kind: ServiceAccount
  name: aitrust-mt-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-mt-operator
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: aitrust-mt-operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aitrust-mt-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aitrust-mt-operator }
    spec:
      serviceAccountName: aitrust-mt-operator
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: operator
        image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
        imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
        env:
        # the subscription operator provisions a tenant in the shared app — it needs the shared-app
        # coordinates + the per-tenant-realm provisioner image, NOT per-copy render vars.
        - { name: PROVIDER_NS, value: "{{ .Values.operator.providerNamespace }}" }
        - { name: SHARED_APP_HOST, value: "{{ .Values.operator.sharedAppHost }}" }
        - { name: PROVISION_IMAGE, value: "{{ .Values.operator.provisionImage }}" }
        - { name: KC_URL, value: "http://keycloak.{{ .Values.operator.providerNamespace }}.svc.cluster.local:8080/keycloak" }
        - { name: GATEWAY_NS, value: "{{ .Values.operator.gatewayNamespace }}" }
        - { name: GATEWAY_NAME, value: "{{ .Values.operator.gatewayName }}" }
        - { name: MSP_WORKER_LABEL, value: "{{ .Values.operator.mspWorkerLabel }}" }
        # v5: multi-realm auth — per-org oauth2-proxy binds to the org's MESH Keycloak realm and routes a
        # per-org host under the wildcard listener; the org admin is seeded into the ONE shared OpenFGA store.
        - { name: INSTANCE_DOMAIN_SUFFIX, value: "{{ .Values.operator.domainSuffix }}" }
        - { name: GATEWAY_SECTION, value: "{{ .Values.operator.gatewaySection }}" }
        - { name: KC_INTERNAL_URL, value: "{{ .Values.operator.kcInternalUrl }}" }
        - { name: KC_PUBLIC_URL, value: "{{ .Values.operator.kcPublicUrl }}" }
        - { name: OPENFGA_URL, value: "{{ .Values.operator.openfgaUrl }}" }
        - { name: OPENFGA_STORE_ID, value: "{{ .Values.operator.openfgaStoreId }}" }
        # mesh Keycloak bootstrap-admin secret the operator copies into the provider ns (mesh-keycloak-admin)
        # so the per-org kc-client Job can auth to the mesh Keycloak Admin API — no manual copy on fresh deploys.
        - { name: MESH_KC_ADMIN_NS, value: "{{ .Values.operator.gatewayNamespace }}" }
        - { name: MESH_KC_ADMIN_SECRET, value: "{{ .Values.operator.meshKcAdminSecret }}" }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
