{{- /*
api-syncagent for the AI Trust Platform MT provider. Mirrors the Subscription CR spec-down /
status-up between the kcp provider workspace and this shoot. Modeled on the private-llm-sync-agent
chart. The agent reads its kcp access from the Secret below (kubeconfig key), and the target cluster
is THIS cluster (in-cluster config via the operator's SA is not used here — the agent runs with the
mounted kcp kubeconfig for the kcp side and in-cluster SA for the local side).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aitrust-mt-syncagent
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aitrust-mt-syncagent
rules:
# the published CR (mirrored objects land in per-consumer namespaces on this cluster)
- apiGroups: ["sub.aitrustmt.msp"]
  resources: [subscriptions, subscriptions/status]
  verbs: ["*"]
# read the local CRD to generate the APIResourceSchema published to kcp
- apiGroups: ["apiextensions.k8s.io"]
  resources: [customresourcedefinitions]
  verbs: [get, list, watch]
# the syncagent mirrors Secrets/events and manages the per-consumer namespaces
- apiGroups: [""]
  resources: [secrets, events, namespaces, configmaps]
  verbs: ["*"]
# leader election
- apiGroups: ["coordination.k8s.io"]
  resources: [leases]
  verbs: ["*"]
- apiGroups: ["syncagent.kcp.io"]
  resources: [publishedresources, publishedresources/status]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aitrust-mt-syncagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aitrust-mt-syncagent
subjects:
- kind: ServiceAccount
  name: aitrust-mt-syncagent
  namespace: {{ .Release.Namespace }}
---
# kcp access kubeconfig for the agent (server rewritten to the provider workspace + :8443).
apiVersion: v1
kind: Secret
metadata:
  name: aitrust-mt-kcp-kubeconfig
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  kubeconfig: |
{{ .Values.kcpKubeconfig.adminContent | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-mt-syncagent
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: aitrust-mt-syncagent }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aitrust-mt-syncagent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aitrust-mt-syncagent }
    spec:
      serviceAccountName: aitrust-mt-syncagent
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent
        image: "{{ .Values.syncagent.image.repository }}:{{ .Values.syncagent.image.tag }}"
        imagePullPolicy: {{ .Values.syncagent.image.pullPolicy }}
        args:
        - --namespace=$(POD_NAMESPACE)
        - --enable-leader-election=true
        - --apiexportendpointslice-ref={{ .Values.exportName }}
        - --agent-name=aitrust-mt-agent
        - --kcp-kubeconfig=/etc/api-syncagent/kcp/kubeconfig
        - --published-resource-selector=app.kubernetes.io/name=aitrust-mt-syncagent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef: { fieldPath: metadata.namespace }
        volumeMounts:
        - { name: kcp-kubeconfig, mountPath: /etc/api-syncagent/kcp, readOnly: true }
      volumes:
      - name: kcp-kubeconfig
        secret:
          secretName: aitrust-mt-kcp-kubeconfig
---
# Publish the Subscription CR. The syncagent generates the APIResourceSchema in the provider
# workspace and mirrors CRs: consumer creates one in their account ws -> lands in a per-consumer
# namespace ({{ .ClusterName }}) on this shoot, where the operator provisions a tenant in the shared app.
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-aitrust-mt-subscriptions
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: aitrust-mt-syncagent }
spec:
  resource:
    kind: Subscription
    apiGroup: sub.aitrustmt.msp
    version: v1alpha1
  naming:
    namespace: "{{`{{ .ClusterName }}`}}"
    name: "{{`{{ .Object.metadata.name }}`}}"
