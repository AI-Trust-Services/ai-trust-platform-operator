# Stage 3 — federation controller + sync-agent deploy (PROD ns aitrust-remote).
# Provisions federated tenants ON ai-trust-1 via the mounted Stage-1 SA kubeconfig.
# Placeholders substituted by stage3-deploy.sh: __IMG__ __A1_KC_INTERNAL__ __A1_KC_PUBLIC__
#   __A1_DOMAIN_SUFFIX__ __DBMIGRATE__ __CHMIGRATE__ __SYNCAGENT_KUBECONFIG_B64__ (or applied by helm-like sed)
---
# 1. CRD — local mirror target for the sync-agent (group sub.aitrust.remote). Adds status.cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: subscriptions.sub.aitrust.remote
spec:
  group: sub.aitrust.remote
  names: { kind: Subscription, listKind: SubscriptionList, plural: subscriptions, singular: subscription, shortNames: [aitremsub] }
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - { name: Cluster, type: string, jsonPath: .status.cluster }
    - { name: URL, type: string, jsonPath: .status.url }
    - { name: Ready, type: boolean, jsonPath: .status.ready }
    - { name: Phase, type: string, jsonPath: .status.phase }
    - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion: { type: string }
          kind: { type: string }
          metadata: { type: object }
          spec:
            type: object
            properties:
              displayName: { type: string, default: "AI Trust Platform (on ai-trust-1)" }
              plan: { type: string, enum: [standard, enterprise], default: standard }
              adminEmail: { type: string, default: "" }
              org: { type: string, default: "" }
              suspended: { type: boolean, default: false }
          status:
            type: object
            properties:
              ready: { type: boolean }
              url: { type: string }
              tenantId: { type: string }
              realm: { type: string }
              cluster: { type: string }   # federation: where the workload lives (ai-trust-1)
              phase: { type: string }
              observedGeneration: { type: integer }
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    status: { type: string }
                    reason: { type: string }
                    message: { type: string }
                    lastTransitionTime: { type: string, format: date-time }
    subresources: { status: {} }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: aitrust-federation, namespace: aitrust-remote }
---
# Local (prod) RBAC — watch the mirrored Subscriptions + write status. Provisioning RBAC lives on a1
# (Stage-1 SA), NOT here; this controller's prod SA only needs the CR + its own ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: aitrust-federation }
rules:
- { apiGroups: ["sub.aitrust.remote"], resources: [subscriptions, subscriptions/status], verbs: [get, list, watch, update, patch] }
# Stage 6 reciprocal SSO: stamp the prod-side IdP client Job in the controller's own ns (aitrust-remote),
# manage the mirrored secrets there, and read prod's mesh keycloak-admin secret in platform-mesh-system.
- { apiGroups: ["batch"], resources: [jobs], verbs: [get, list, watch, create, update, patch, delete] }
- { apiGroups: [""], resources: [secrets], verbs: [get, list, watch, create, update, patch, delete] }
- { apiGroups: [""], resources: [pods, pods/log, configmaps], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: aitrust-federation }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aitrust-federation }
subjects: [{ kind: ServiceAccount, name: aitrust-federation, namespace: aitrust-remote }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-federation
  namespace: aitrust-remote
  labels: { app.kubernetes.io/name: aitrust-federation }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: aitrust-federation } }
  template:
    metadata: { labels: { app.kubernetes.io/name: aitrust-federation } }
    spec:
      serviceAccountName: aitrust-federation
      containers:
      - name: federation
        image: __IMG__
        imagePullPolicy: Always
        env:
        - { name: REMOTE_KUBECONFIG, value: /etc/a1/kubeconfig }   # the mounted Stage-1 a1 SA kubeconfig
        - { name: PROVIDER_NS, value: aitrust-msp }                # ns ON ai-trust-1
        - { name: INSTANCE_DOMAIN_SUFFIX, value: __A1_DOMAIN_SUFFIX__ }
        - { name: GATEWAY_NS, value: platform-mesh-system }        # a1 gateway ns
        - { name: GATEWAY_NAME, value: k8sapi-gateway }
        - { name: GATEWAY_SECTION, value: terminate-wildstar }
        - { name: KC_INTERNAL_URL, value: __A1_KC_INTERNAL__ }
        - { name: KC_PUBLIC_URL, value: __A1_KC_PUBLIC__ }
        - { name: MESH_KC_ADMIN_NS, value: platform-mesh-system }
        - { name: MESH_KC_ADMIN_SECRET, value: keycloak-admin }
        - { name: DBMIGRATE_IMAGE, value: __DBMIGRATE__ }
        - { name: CHMIGRATE_IMAGE, value: __CHMIGRATE__ }
        - { name: APP_DB_ROLE, value: ai_trust_app }
        - { name: MSP_WORKER_LABEL, value: ai-trust }
        volumeMounts:
        - { name: a1, mountPath: /etc/a1, readOnly: true }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
      volumes:
      - name: a1
        secret: { secretName: aitrust-1-shoot-kubeconfig }   # Stage-1 Secret (key: kubeconfig)
