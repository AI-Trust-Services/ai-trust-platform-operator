# Stage 1 — scoped ServiceAccount on ai-trust-1 that the prod federation controller uses to
# provision tenants on ai-trust-1. Least-privilege: only what tenant-stores-job + HTTPRoute need.
# Applied INTO ai-trust-1 (ns aitrust-msp). NO control-plane / kcp change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aitrust-federation
  namespace: aitrust-msp
  labels: { app.kubernetes.io/managed-by: federation, app.kubernetes.io/part-of: aitrust-federation }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aitrust-federation
  namespace: aitrust-msp
  labels: { app.kubernetes.io/part-of: aitrust-federation }
rules:
  # Provision the per-tenant stores + broker by stamping Jobs (server-side apply needs patch; read status).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Read the shared app-secrets so the rendered Job can reference them (secretKeyRef); also create/manage
  # the per-org oauth2 + broker client secrets the controller stamps (aitrust-oauth2-<org>,
  # aitrust-fedbroker-<org>, mesh-keycloak-admin copy).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Per-tenant oauth2-proxy deployment + service (the org proxy the operator normally stamps).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ReferenceGrant allowing the gateway ns to reach the per-org proxy Service (created in this ns).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Gateway API HTTPRoutes live in the gateway namespace on ai-trust-1 — a SEPARATE Role there so the
# controller can publish ai-trust-<org>.ai-trust-1 routes. (Namespace confirmed at apply time.)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aitrust-federation
  namespace: aitrust-msp
  labels: { app.kubernetes.io/part-of: aitrust-federation }
subjects:
  - kind: ServiceAccount
    name: aitrust-federation
    namespace: aitrust-msp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aitrust-federation
---
# Gateway API HTTPRoutes on ai-trust-1 live in platform-mesh-system (confirmed: existing per-tenant
# routes aitrust-<org> are there, host ai-trust-<org>.ai-trust-1...). A scoped Role there lets the
# federation controller publish/remove ai-trust-<org>.ai-trust-1 routes — nothing else in that ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aitrust-federation-routes
  namespace: platform-mesh-system
  labels: { app.kubernetes.io/part-of: aitrust-federation }
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The federation controller reads the mesh Keycloak bootstrap-admin secret (keycloak-admin) here to
  # (a) gate on the tenant realm existing and (b) copy it into aitrust-msp for the per-org kc-client Job.
  # get/list only — no write.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aitrust-federation-routes
  namespace: platform-mesh-system
  labels: { app.kubernetes.io/part-of: aitrust-federation }
subjects:
  - kind: ServiceAccount
    name: aitrust-federation
    namespace: aitrust-msp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aitrust-federation-routes
---
# Long-lived token for the SA (k8s 1.24+ does not auto-create SA token secrets; request one explicitly).
apiVersion: v1
kind: Secret
metadata:
  name: aitrust-federation-token
  namespace: aitrust-msp
  annotations:
    kubernetes.io/service-account.name: aitrust-federation
  labels: { app.kubernetes.io/part-of: aitrust-federation }
type: kubernetes.io/service-account-token
