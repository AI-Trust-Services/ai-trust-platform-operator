# Stage 2 — a tiny nginx in prod ns aitrust-remote that serves the FEDERATED tile pm-content.json.
# The -remote ContentConfiguration in kcp points the portal here (in-cluster HTTP, like the local tile).
# The pm-content.json is injected from the ConfigMap generated by stage2-provider.sh from
# stage2-remote-tile.json (kept as a file so it is reviewable/versioned).
apiVersion: v1
kind: Service
metadata:
  name: aitrust-remote-portal
  namespace: aitrust-remote
  labels: { app: aitrust-remote-portal, app.kubernetes.io/part-of: aitrust-federation }
spec:
  selector: { app: aitrust-remote-portal }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-remote-portal
  namespace: aitrust-remote
  labels: { app: aitrust-remote-portal, app.kubernetes.io/part-of: aitrust-federation }
spec:
  replicas: 1
  selector: { matchLabels: { app: aitrust-remote-portal } }
  template:
    metadata:
      labels: { app: aitrust-remote-portal }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: tile, mountPath: /usr/share/nginx/html/pm-content.json, subPath: pm-content.json }
          readinessProbe:
            httpGet: { path: /pm-content.json, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: tile
          configMap: { name: aitrust-remote-tile }
