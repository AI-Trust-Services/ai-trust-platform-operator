# Stage 3 — api-syncagent bound to sub.aitrust.remote (PROD ns aitrust-remote).
# Publishes the Subscription CR into prod kcp ws root:providers:ai-trust-remote and mirrors consumer
# Subscriptions down to this cluster (where the federation controller provisions them ON ai-trust-1).
# Placeholders: __SYNCAGENT_IMAGE__  (kcp kubeconfig Secret aitrust-remote-kcp-kubeconfig applied separately)
apiVersion: v1
kind: ServiceAccount
metadata: { name: aitrust-remote-syncagent, namespace: aitrust-remote }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: aitrust-remote-syncagent }
rules:
- { apiGroups: ["sub.aitrust.remote"], resources: [subscriptions, subscriptions/status], verbs: ["*"] }
- { apiGroups: ["apiextensions.k8s.io"], resources: [customresourcedefinitions], verbs: [get, list, watch] }
- { apiGroups: [""], resources: [secrets, events, namespaces, configmaps], verbs: ["*"] }
- { apiGroups: ["coordination.k8s.io"], resources: [leases], verbs: ["*"] }
- { apiGroups: ["syncagent.kcp.io"], resources: [publishedresources, publishedresources/status], verbs: ["*"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: aitrust-remote-syncagent }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aitrust-remote-syncagent }
subjects: [{ kind: ServiceAccount, name: aitrust-remote-syncagent, namespace: aitrust-remote }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrust-remote-syncagent
  namespace: aitrust-remote
  labels: { app.kubernetes.io/name: aitrust-remote-syncagent }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: aitrust-remote-syncagent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: aitrust-remote-syncagent } }
    spec:
      serviceAccountName: aitrust-remote-syncagent
      containers:
      - name: agent
        image: __SYNCAGENT_IMAGE__
        imagePullPolicy: IfNotPresent
        args:
        - --namespace=$(POD_NAMESPACE)
        - --enable-leader-election=true
        - --apiexportendpointslice-ref=sub.aitrust.remote
        - --agent-name=aitrust-remote-agent
        - --kcp-kubeconfig=/etc/api-syncagent/kcp/kubeconfig
        - --published-resource-selector=app.kubernetes.io/name=aitrust-remote-syncagent
        env:
        - name: POD_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        volumeMounts:
        - { name: kcp-kubeconfig, mountPath: /etc/api-syncagent/kcp, readOnly: true }
      volumes:
      - name: kcp-kubeconfig
        secret: { secretName: aitrust-remote-kcp-kubeconfig }
---
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-aitrust-remote-subscriptions
  namespace: aitrust-remote
  labels: { app.kubernetes.io/name: aitrust-remote-syncagent }
spec:
  resource: { kind: Subscription, apiGroup: sub.aitrust.remote, version: v1alpha1 }
  naming:
    namespace: "{{ .ClusterName }}"
    name: "{{ .Object.metadata.name }}"
